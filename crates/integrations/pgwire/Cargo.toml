[package]
name = "paimon-pgwire"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Apache Paimon PostgreSQL wire protocol server (PoC)"
categories = ["database"]
keywords = ["paimon", "pgwire", "postgresql", "datafusion"]

[[bin]]
name = "paimon-pgwire-server"
path = "src/main.rs"

[dependencies]
# pgwire provides the PostgreSQL wire protocol implementation
pgwire = { version = "0.40", default-features = false, features = ["server-api-aws-lc-rs"] }

# Async runtime
async-trait = "0.1"
futures = "0.3"
tokio = { workspace = true, features = ["full"] }

# DataFusion for query execution
datafusion = { workspace = true }

# Paimon DataFusion integration (the existing TableProvider crate)
paimon-datafusion = { path = "../datafusion" }

# Paimon core (for CatalogFactory, Options)
paimon = { workspace = true }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"
